name: Validate armory and account isolation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --check site/app.js && node --check site/cloud.js
      - run: npm test
      - run: npm run test:security
      - name: Install browser for community and Armory acceptance
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify guarded addon collectors with Lua mocks
        run: |
          python3 -m venv /tmp/forever-lua
          /tmp/forever-lua/bin/pip install lupa==2.8
          /tmp/forever-lua/bin/python tests/addon-smoke.py /tmp/forever-addon-test.json
          node scripts/verify-addon-export.mjs /tmp/forever-addon-test.json
          node scripts/verify-addon-export.mjs /tmp/forever-addon-test.json.lua
      - run: python3 scripts/package.py
      - name: Stage production Pages candidate
        run: python3 scripts/build-site.py
      - name: Save reviewed Pages candidate
        uses: actions/upload-artifact@v4
        with:
          name: forever-pages-candidate
          path: .pages-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
